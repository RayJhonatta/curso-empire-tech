<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media-query.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="shortcut icon" href="../../assets/img/favicon_io (1)/favicon.ico" type="image/x-icon">
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Painel de Filme Assistidos</title>
</head>
<body>
    <main class="container">
        <header class="header-container">
            <div class="icons-container">
                <p class="header-paragraph">
                    <i class="material-icons">person</i>
                Ray Jhonatta</p>
                <span class="link-header">
                    <i class="material-icons" onclick="BackToLoginScreen()">logout</i>
                </span>    
            </div>
        </header>
        <section>
            <h1>Painel de Filmes Assistidos</h1>
            <section class="edit-movie-container">
                <div class="title-container">
                    <h2>Adicionar / Editar Filme</h2>
                    <hr style="border: 0.5px solid rgba(167, 167, 167, 0.476)">
                </div>
                <div class="field-edit-movie">
                    <div class="field-line">
                        <label for="title" class="label-edit-movie">Título:</label>
                        <input type="text" name="title" id="title" class="input-edit-movie" placeholder="Adicione o nome do filme">
                    </div>
                    
                    <div class="field-line">
                        <label for="gender" class="label-edit-movie">Gênero:</label>
                        <input type="text" name="gender" id="gender" class="input-edit-movie" placeholder="Adicione o gênero do filme">
                    </div>
                    
                    <div class="field-line">
                        <label for="year" class="label-edit-movie">Data:</label>
                        <input type="number" name="year" id="year" class="input-edit-movie" placeholder="Adicione a data do filme">
                    </div>
                        <button type="submit" class="button-add-movie" onclick="createMovies()">Adicionar Filme</button>
                </div>
            </section>
            <section class="filter-movie">
                <div class="title-container">
                    <h2>Filtrar Filmes</h2>
                    <hr style="border: 0.5px solid rgba(167, 167, 167, 0.476)">
                </div>
                <div class="filter-movie-fields">
                    <input type="text" name="title" id="title" class="fields-filter-movie" placeholder="Buscar por Titulo">
                    <input type="text" name="gender" id="field-filter-movie" placeholder="Buscar por Gênero">
                    <input type="number" name="year" id="year" class="fields-filter-movie" placeholder="Buscar por Data">
                </div>
            </section>
            <section class="table-film-seen">
                <div class="title-container">
                    <h2>Filmes Assistidos</h2> 
                    <hr style="border: 0.5px solid rgba(167, 167, 167, 0.476)">
                </div>
                <div class="table-data-movies">
                    <table id="moviesTable">
                        <thead>
                            <tr>
                                <th class="title-first">Titulo</th>
                                <th class="title-second">Gênero</th>
                                <th class="title-third">Ano</th>
                                <th class="title-fourth">Ações</th>
                            </tr>
                        </thead>
                        <tbody class="tbody-table">
                            <tr>
                                <td class="data-table">
                                    <a href="#" class="link-edit-table" data-id="1">
                                        <i class="material-icons">edit</i>
                                        Editar</a> 
                                    <a href="#" class="link-delete-table">
                                        <i class="material-icons">delete</i>
                                    Deletar</a>   
                                </td>                     
                            </tr>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
